<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | La Lechería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        #sidebar { width: 250px; transition: all 0.3s ease; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-text { display: none; }
        #sidebar.collapsed .list-group-item { justify-content: center !important; padding-left: 0; padding-right: 0; }
        #sidebar.collapsed .list-group-item i { margin-right: 0 !important; font-size: 1.2rem; }
        .main-content { flex-grow: 1; min-width: 0; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-light">

    <header class="bg-black py-3 border-bottom border-secondary sticky-top shadow">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4">
            <div class="d-flex align-items-center">
                <button class="btn btn-dark bg-black border-0 me-3 fs-5" id="btn-toggle-sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a href="panel.html" class="text-white text-decoration-none d-flex align-items-center">
                    <img src="../assets/img/logotipo.png" width="45" class="filter-white me-3" alt="Logo">
                    <h4 class="mb-0 fw-bold d-none d-sm-block">LA LECHERÍA <span class="badge bg-white text-black ms-2 fs-6">ADMIN</span></h4>
                </a>
            </div>
            <div class="text-white d-flex align-items-center">
                <span class="me-4 d-none d-md-block">Admin: <strong id="admin-name" class="text-warning">...</strong></span>
                <button class="btn btn-outline-light btn-sm rounded-0 fw-bold px-4 py-2" id="btn-logout">SALIR</button>
            </div>
        </div>
    </header>

    <div class="d-flex min-vh-100">
        <aside id="sidebar" class="bg-white border-end border-dark flex-shrink-0 shadow-sm">
            <div class="list-group list-group-flush mt-3 position-sticky" style="top: 90px;">
                <a href="panel.html" class="list-group-item list-group-item-action py-3 fw-bold active bg-black border-dark d-flex align-items-center">
                    <i class="fa-solid fa-gauge fs-5 me-3"></i> 
                    <span class="sidebar-text">DASHBOARD</span>
                </a>
                <a href="pedidos.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-receipt fs-5 me-3"></i> 
                    <span class="sidebar-text">PEDIDOS</span>
                </a>
                <a href="categorias.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-tags fs-5 me-3"></i> 
                    <span class="sidebar-text">CATEGORÍAS</span>
                </a>
                <a href="productos.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-boxes-stacked fs-5 me-3"></i> 
                    <span class="sidebar-text">PRODUCTOS</span>
                </a>
                <a href="usuarios.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-users fs-5 me-3"></i> 
                    <span class="sidebar-text">USUARIOS</span>
                </a>
            </div>
        </aside>

        <main class="main-content p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">RESUMEN GENERAL</h2>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-xl-4 col-md-6">
                    <div class="card border-dark rounded-0 shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="text-muted fw-bold mb-2"><i class="fa-solid fa-chart-line me-2"></i> VENTAS DEL MES</h6>
                            <h2 class="fw-bold mb-0">S/ 0.00</h2>
                        </div>
                    </div>
                </div>
                <div class="col-xl-4 col-md-6">
                    <div class="card border-dark rounded-0 shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="text-muted fw-bold mb-2"><i class="fa-solid fa-clipboard-list me-2"></i> PEDIDOS PENDIENTES</h6>
                            <h2 class="fw-bold mb-0">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-xl-4 col-md-6">
                    <div class="card border-dark rounded-0 shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="text-danger fw-bold mb-2"><i class="fa-solid fa-triangle-exclamation me-2"></i> STOCK CRÍTICO</h6>
                            <h2 class="fw-bold mb-0 text-danger">0</h2>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-dark rounded-0 shadow-sm">
                <div class="card-header bg-white border-dark fw-bold py-3">
                    ÚLTIMOS MOVIMIENTOS
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">ID PEDIDO</th>
                                <th>CLIENTE</th>
                                <th>FECHA</th>
                                <th>TOTAL</th>
                                <th>ESTADO</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">No hay pedidos recientes registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const adminName = localStorage.getItem('usuario_nombre');
            const userRol = localStorage.getItem('usuario_rol');

            if (!adminName || userRol !== 'ADMIN') {
                window.location.href = '../auth/login.html';
            } else {
                document.getElementById('admin-name').textContent = adminName.toUpperCase();
            }

            document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('collapsed');
            });

            document.getElementById('btn-logout').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = '../index.html';
            });
        });
    </script>
</body>
</html>
