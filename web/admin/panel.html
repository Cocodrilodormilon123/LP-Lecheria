<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | La Lechería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        #sidebar { width: 250px; transition: all 0.3s ease; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-text { display: none; }
        #sidebar.collapsed .list-group-item { justify-content: center !important; padding-left: 0; padding-right: 0; }
        #sidebar.collapsed .list-group-item i { margin-right: 0 !important; font-size: 1.2rem; }
        .main-content { flex-grow: 1; min-width: 0; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-light">

    <header class="bg-black py-3 border-bottom border-secondary sticky-top shadow">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4">
            <div class="d-flex align-items-center">
                <button class="btn btn-dark bg-black border-0 me-3 fs-5" id="btn-toggle-sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a href="panel.html" class="text-white text-decoration-none d-flex align-items-center">
                    <img src="../assets/img/logotipo.png" width="45" class="filter-white me-3" alt="Logo">
                    <h4 class="mb-0 fw-bold d-none d-sm-block">LA LECHERÍA <span class="badge bg-white text-black ms-2 fs-6">ADMIN</span></h4>
                </a>
            </div>
            <div class="text-white d-flex align-items-center">
                <span class="me-4 d-none d-md-block">Admin: <strong id="admin-name" class="text-warning">...</strong></span>
                <button class="btn btn-outline-light btn-sm rounded-0 fw-bold px-4 py-2" id="btn-logout">SALIR</button>
            </div>
        </div>
    </header>

    <div class="d-flex min-vh-100">
        <aside id="sidebar" class="bg-white border-end border-dark flex-shrink-0 shadow-sm">
            <div class="list-group list-group-flush mt-3 position-sticky" style="top: 90px;">
                <a href="panel.html" class="list-group-item list-group-item-action py-3 fw-bold active bg-black border-dark d-flex align-items-center">
                    <i class="fa-solid fa-gauge fs-5 me-3"></i> 
                    <span class="sidebar-text">DASHBOARD</span>
                </a>
                <a href="pedidos.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-receipt fs-5 me-3"></i> 
                    <span class="sidebar-text">PEDIDOS</span>
                </a>
                <a href="categorias.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-tags fs-5 me-3"></i> 
                    <span class="sidebar-text">CATEGORÍAS</span>
                </a>
                <a href="productos.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-boxes-stacked fs-5 me-3"></i> 
                    <span class="sidebar-text">PRODUCTOS</span>
                </a>
                <a href="usuarios.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-users fs-5 me-3"></i> 
                    <span class="sidebar-text">USUARIOS</span>
                </a>
            </div>
        </aside>

        <main class="main-content p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">RESUMEN GENERAL</h2>
                <button class="btn btn-outline-dark fw-bold rounded-0" onclick="cargarDatosDashboard()"><i class="fa-solid fa-rotate-right me-2"></i> ACTUALIZAR</button>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-xl-4 col-md-6">
                    <div class="card border-dark rounded-0 shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="text-muted fw-bold mb-2"><i class="fa-solid fa-chart-line me-2"></i> VENTAS DEL MES</h6>
                            <h2 class="fw-bold mb-0 text-success" id="kpi-ventas">S/ 0.00</h2>
                        </div>
                    </div>
                </div>
                <div class="col-xl-4 col-md-6">
                    <div class="card border-dark rounded-0 shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="text-muted fw-bold mb-2"><i class="fa-solid fa-clipboard-list me-2"></i> PEDIDOS PENDIENTES</h6>
                            <h2 class="fw-bold mb-0 text-primary" id="kpi-pendientes">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-xl-4 col-md-6">
                    <div class="card border-dark rounded-0 shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="text-danger fw-bold mb-2"><i class="fa-solid fa-triangle-exclamation me-2"></i> STOCK CRÍTICO</h6>
                            <h2 class="fw-bold mb-0 text-danger" id="kpi-stock">0</h2>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-lg-6">
                    <div class="card border-dark rounded-0 shadow-sm h-100">
                        <div class="card-header bg-white border-dark fw-bold py-3 text-center">ESTADO DE LOS PEDIDOS</div>
                        <div class="card-body d-flex justify-content-center align-items-center" style="height: 320px;">
                            <canvas id="chartEstados"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card border-dark rounded-0 shadow-sm h-100">
                        <div class="card-header bg-white border-dark fw-bold py-3 text-center">INGRESOS POR MÉTODO DE PAGO</div>
                        <div class="card-body d-flex justify-content-center align-items-center" style="height: 320px;">
                            <canvas id="chartPagos"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-dark rounded-0 shadow-sm">
                <div class="card-header bg-white border-dark fw-bold py-3">
                    ÚLTIMOS 5 MOVIMIENTOS
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4">ID PEDIDO</th>
                                    <th>CLIENTE</th>
                                    <th>FECHA</th>
                                    <th>TOTAL</th>
                                    <th>ESTADO</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-ultimos-pedidos">
                                <tr>
                                    <td colspan="5" class="text-center text-muted py-4">Cargando movimientos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let chartEst = null;
        let chartPag = null;

        document.addEventListener('DOMContentLoaded', () => {
            const adminName = localStorage.getItem('usuario_nombre');
            const userRol = localStorage.getItem('usuario_rol');

            if (!adminName || userRol !== 'ADMIN') {
                window.location.href = '../auth/login.html';
                return;
            }
            
            document.getElementById('admin-name').textContent = adminName.toUpperCase();

            document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('collapsed');
            });

            document.getElementById('btn-logout').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = '../index.html';
            });

            cargarDatosDashboard();
        });

        async function cargarDatosDashboard() {
            try {
                let pedidos = [];
                try {
                    const resPedidos = await fetch('../PedidoServlet');
                    if (resPedidos.ok) pedidos = await resPedidos.json();
                } catch(e) { console.error("Error pedidos", e); }

                let productos = [];
                try {
                    const resProductos = await fetch('../ProductoServlet?accion=listarAdminJSON');
                    if (resProductos.ok) productos = await resProductos.json();
                } catch(e) { console.error("Error productos", e); }

                calcularKPIs(pedidos, productos);
                llenarTablaRecientes(pedidos);
                dibujarGraficos(pedidos);

            } catch (error) {
                document.getElementById('tabla-ultimos-pedidos').innerHTML = `<tr><td colspan="5" class="text-danger py-4">Error de conexión con el servidor.</td></tr>`;
            }
        }

        function calcularKPIs(pedidos, productos) {
            const stockCritico = productos.filter(p => p.stock < 5).length;
            document.getElementById('kpi-stock').textContent = stockCritico;

            const pendientes = pedidos.filter(p => p.estado !== 'ENTREGADO' && p.estado !== 'CANCELADO').length;
            document.getElementById('kpi-pendientes').textContent = pendientes;

            const hoy = new Date();
            const mesActual = hoy.getMonth() + 1; 
            const anioActual = hoy.getFullYear();
            let totalVentas = 0;

            pedidos.forEach(p => {
                if (p.fecha && p.estado !== 'CANCELADO') {
                    const partesFecha = p.fecha.split('-');
                    if (partesFecha.length >= 2) {
                        const anioPed = parseInt(partesFecha[0]);
                        const mesPed = parseInt(partesFecha[1]);
                        
                        if (anioPed === anioActual && mesPed === mesActual) {
                            totalVentas += parseFloat(p.total);
                        }
                    }
                }
            });
            document.getElementById('kpi-ventas').textContent = `S/ ${totalVentas.toFixed(2)}`;
        }

        function llenarTablaRecientes(pedidos) {
            const tbody = document.getElementById('tabla-ultimos-pedidos');
            tbody.innerHTML = '';

            if (!pedidos || pedidos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-muted py-4">No hay pedidos registrados en el sistema.</td></tr>`;
                return;
            }

            const ultimos = pedidos.slice(0, 5);

            ultimos.forEach(p => {
                let badgeClass = 'bg-secondary';
                if (p.estado === 'PENDIENTE_PAGO' || p.estado === 'EN_VERIFICACION') badgeClass = 'bg-warning text-dark';
                if (p.estado === 'PREPARANDO' || p.estado === 'EN_CAMINO' || p.estado === 'LISTO_RECOJO') badgeClass = 'bg-primary';
                if (p.estado === 'ENTREGADO') badgeClass = 'bg-success';
                if (p.estado === 'CANCELADO') badgeClass = 'bg-danger';

                tbody.innerHTML += `
                    <tr>
                        <td class="ps-4 fw-bold">#${p.id_pedido}</td>
                        <td>${p.cliente}</td>
                        <td class="small">${p.fecha ? p.fecha.substring(0, 10) : ''}</td>
                        <td class="fw-bold text-success">S/ ${p.total.toFixed(2)}</td>
                        <td><span class="badge ${badgeClass}">${p.estado.replace(/_/g, ' ')}</span></td>
                    </tr>
                `;
            });
        }

        function dibujarGraficos(pedidos) {
            const conteoEstados = {};
            const ventasPorPago = {};

            if (pedidos && pedidos.length > 0) {
                pedidos.forEach(p => {
                    const est = p.estado.replace(/_/g, ' ');
                    conteoEstados[est] = (conteoEstados[est] || 0) + 1;

                    if (p.estado !== 'CANCELADO') {
                        const pago = p.metodo_pago;
                        ventasPorPago[pago] = (ventasPorPago[pago] || 0) + parseFloat(p.total);
                    }
                });
            }

            if (chartEst) chartEst.destroy();
            if (chartPag) chartPag.destroy();

            const ctxEstados = document.getElementById('chartEstados').getContext('2d');
            const dataEstados = Object.keys(conteoEstados).length > 0 ? Object.values(conteoEstados) : [1];
            const labelsEstados = Object.keys(conteoEstados).length > 0 ? Object.keys(conteoEstados) : ['Sin Datos'];
            const bgEstados = Object.keys(conteoEstados).length > 0 ? ['#ffc107', '#0d6efd', '#198754', '#dc3545', '#0dcaf0', '#212529'] : ['#e9ecef'];

            chartEst = new Chart(ctxEstados, {
                type: 'doughnut',
                data: {
                    labels: labelsEstados,
                    datasets: [{
                        data: dataEstados,
                        backgroundColor: bgEstados,
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });

            const ctxPagos = document.getElementById('chartPagos').getContext('2d');
            const dataPagos = Object.keys(ventasPorPago).length > 0 ? Object.values(ventasPorPago) : [0];
            const labelsPagos = Object.keys(ventasPorPago).length > 0 ? Object.keys(ventasPorPago) : ['Sin Datos'];

            chartPag = new Chart(ctxPagos, {
                type: 'bar',
                data: {
                    labels: labelsPagos,
                    datasets: [{
                        label: 'Ingresos (S/)',
                        data: dataPagos,
                        backgroundColor: '#212529',
                        borderRadius: 4
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: { 
                        y: { beginAtZero: true, grid: { color: '#e9ecef' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    </script>
</body>
</html>
