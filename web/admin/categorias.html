<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías | La Lechería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        #sidebar { width: 250px; transition: all 0.3s ease; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-text { display: none; }
        #sidebar.collapsed .list-group-item { justify-content: center !important; padding-left: 0; padding-right: 0; }
        #sidebar.collapsed .list-group-item i { margin-right: 0 !important; font-size: 1.2rem; }
        .main-content { flex-grow: 1; min-width: 0; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-light">

    <header class="bg-black py-3 border-bottom border-secondary sticky-top shadow">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4">
            <div class="d-flex align-items-center">
                <button class="btn btn-dark bg-black border-0 me-3 fs-5" id="btn-toggle-sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a href="panel.html" class="text-white text-decoration-none d-flex align-items-center">
                    <img src="../assets/img/logotipo.png" width="45" class="filter-white me-3" alt="Logo">
                    <h4 class="mb-0 fw-bold d-none d-sm-block">LA LECHERÍA <span class="badge bg-white text-black ms-2 fs-6">ADMIN</span></h4>
                </a>
            </div>
            <div class="text-white d-flex align-items-center">
                <span class="me-4 d-none d-md-block">Admin: <strong id="admin-name" class="text-warning">...</strong></span>
                <button class="btn btn-outline-light btn-sm rounded-0 fw-bold px-4 py-2" id="btn-logout">SALIR</button>
            </div>
        </div>
    </header>

    <div class="d-flex min-vh-100">
        <aside id="sidebar" class="bg-white border-end border-dark flex-shrink-0 shadow-sm">
            <div class="list-group list-group-flush mt-3 position-sticky" style="top: 90px;">
                <a href="panel.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-gauge fs-5 me-3"></i> 
                    <span class="sidebar-text">DASHBOARD</span>
                </a>
                <a href="pedidos.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-receipt fs-5 me-3"></i> 
                    <span class="sidebar-text">PEDIDOS</span>
                </a>
                <a href="categorias.html" class="list-group-item list-group-item-action py-3 fw-bold active bg-black border-dark d-flex align-items-center">
                    <i class="fa-solid fa-tags fs-5 me-3"></i> 
                    <span class="sidebar-text">CATEGORÍAS</span>
                </a>
                <a href="productos.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-boxes-stacked fs-5 me-3"></i> 
                    <span class="sidebar-text">PRODUCTOS</span>
                </a>
                <a href="usuarios.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-users fs-5 me-3"></i> 
                    <span class="sidebar-text">USUARIOS</span>
                </a>
            </div>
        </aside>

        <main class="main-content p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-uppercase">Gestión de Categorías</h2>
                <button class="btn btn-cow" data-bs-toggle="modal" data-bs-target="#modalCat">
                    <i class="fa-solid fa-plus me-2"></i> NUEVA CATEGORÍA
                </button>
            </div>

            <div class="card border-dark rounded-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>NOMBRE</th>
                                    <th>DESCRIPCIÓN</th>
                                    <th class="text-center">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody id="lista-categorias">
                                <tr><td colspan="4" class="text-center py-4">Cargando categorías...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="modalCat" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-0 border-dark shadow-lg">
                <div class="modal-header bg-black text-white rounded-0">
                    <h5 class="modal-title fw-bold">DATOS DE CATEGORÍA</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-categoria">
                    <div class="modal-body p-4">
                        <input type="hidden" name="accion" id="accion_categoria" value="registrar">
                        <input type="hidden" name="id_categoria" id="id_categoria_input">
                        <div class="mb-3">
                            <label class="fw-bold small mb-1">NOMBRE DE CATEGORÍA</label>
                            <input type="text" name="nombre" id="nombre_cat_input" class="form-control form-control-lg rounded-0 border-dark" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold small mb-1">DESCRIPCIÓN BREVE</label>
                            <textarea name="descripcion" id="desc_cat_input" class="form-control rounded-0 border-dark" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-outline-dark rounded-0 fw-bold px-4" data-bs-dismiss="modal">CANCELAR</button>
                        <button type="submit" class="btn btn-cow px-4">GUARDAR</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const adminName = localStorage.getItem('usuario_nombre');
            const userRol = localStorage.getItem('usuario_rol');

            if (!adminName || userRol !== 'ADMIN') {
                window.location.href = '../auth/login.html';
            } else {
                document.getElementById('admin-name').textContent = adminName.toUpperCase();
            }

            document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('collapsed');
            });

            window.cargarCategorias = async () => {
                try {
                    const res = await fetch('../CategoriaServlet?accion=listarJSON');
                    const categorias = await res.json();
                    const tbody = document.getElementById('lista-categorias');
                    tbody.innerHTML = '';

                    if(categorias.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No hay categorías registradas</td></tr>';
                        return;
                    }

                    categorias.forEach(c => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="ps-4 fw-bold text-muted">#${c.id_categoria}</td>
                                <td class="fw-bold">${c.nombre}</td>
                                <td>${c.descripcion}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-dark rounded-0" onclick="prepararEdicionCategoria(${c.id_categoria}, \`${c.nombre}\`, \`${c.descripcion}\`)"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn btn-sm btn-outline-danger rounded-0 ms-1" onclick="eliminarCategoria(${c.id_categoria})"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                } catch (error) {
                    console.error("Error", error);
                }
            };

            window.prepararEdicionCategoria = (id, nombre, descripcion) => {
                document.getElementById('id_categoria_input').value = id;
                document.getElementById('nombre_cat_input').value = nombre;
                document.getElementById('desc_cat_input').value = descripcion;
                document.getElementById('accion_categoria').value = 'actualizar';
                document.querySelector('#modalCat .modal-title').textContent = 'EDITAR CATEGORÍA';
                bootstrap.Modal.getOrCreateInstance(document.getElementById('modalCat')).show();
            };

            window.eliminarCategoria = async (id) => {
                const result = await Swal.fire({
                    title: '¿Estás seguro?',
                    text: "No podrás revertir esta acción.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#000',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar'
                });

                if (result.isConfirmed) {
                    try {
                        const datos = new URLSearchParams();
                        datos.append('accion', 'eliminar');
                        datos.append('id_categoria', id);

                        const res = await fetch('../CategoriaServlet', {
                            method: 'POST',
                            body: datos,
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                        });

                        if(res.ok) {
                            Swal.fire('¡Eliminado!', 'Categoría eliminada.', 'success');
                            cargarCategorias();
                        } else {
                            throw new Error();
                        }
                    } catch (error) {
                        Swal.fire('Error', 'No se pudo eliminar la categoría.', 'error');
                    }
                }
            };

            cargarCategorias();

            const formCat = document.getElementById('form-categoria');
            formCat.addEventListener('submit', async (e) => {
                e.preventDefault();
                const datos = new URLSearchParams(new FormData(formCat));

                Swal.fire({ title: 'Procesando...', didOpen: () => Swal.showLoading() });

                try {
                    const res = await fetch('../CategoriaServlet', {
                        method: 'POST',
                        body: datos,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });

                    if(res.ok) {
                        Swal.fire('¡Éxito!', 'Operación completada', 'success');
                        bootstrap.Modal.getOrCreateInstance(document.getElementById('modalCat')).hide();
                        formCat.reset();
                        cargarCategorias();
                    } else {
                        throw new Error();
                    }
                } catch (error) {
                    Swal.fire('Error', 'No se pudo guardar la categoría', 'error');
                }
            });

            document.getElementById('modalCat').addEventListener('hidden.bs.modal', () => {
                document.getElementById('form-categoria').reset();
                document.getElementById('accion_categoria').value = 'registrar';
                document.querySelector('#modalCat .modal-title').textContent = 'DATOS DE CATEGORÍA';
            });

            document.getElementById('btn-logout').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = '../index.html';
            });
        });
    </script>
</body>
</html>
