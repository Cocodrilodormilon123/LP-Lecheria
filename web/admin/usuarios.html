<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        #sidebar { width: 250px; transition: all 0.3s ease; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-text { display: none; }
        #sidebar.collapsed .list-group-item { justify-content: center !important; padding-left: 0; padding-right: 0; }
        #sidebar.collapsed .list-group-item i { margin-right: 0 !important; font-size: 1.2rem; }
        .main-content { flex-grow: 1; min-width: 0; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-light">

    <header class="bg-black py-3 border-bottom border-secondary sticky-top shadow">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4">
            <div class="d-flex align-items-center">
                <button class="btn btn-dark bg-black border-0 me-3 fs-5" id="btn-toggle-sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a href="panel.html" class="text-white text-decoration-none d-flex align-items-center">
                    <img src="../assets/img/logotipo.png" width="45" class="filter-white me-3" alt="Logo">
                    <h4 class="mb-0 fw-bold d-none d-sm-block">LA LECHERÍA <span class="badge bg-white text-black ms-2 fs-6">ADMIN</span></h4>
                </a>
            </div>
            <div class="text-white d-flex align-items-center">
                <span class="me-4 d-none d-md-block">Admin: <strong id="admin-name" class="text-warning">...</strong></span>
                <button class="btn btn-outline-light btn-sm rounded-0 fw-bold px-4 py-2" id="btn-logout">SALIR</button>
            </div>
        </div>
    </header>

    <div class="d-flex min-vh-100">
        <aside id="sidebar" class="bg-white border-end border-dark flex-shrink-0 shadow-sm">
            <div class="list-group list-group-flush mt-3 position-sticky" style="top: 90px;">
                <a href="panel.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-gauge fs-5 me-3"></i> 
                    <span class="sidebar-text">DASHBOARD</span>
                </a>
                <a href="pedidos.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-receipt fs-5 me-3"></i> 
                    <span class="sidebar-text">PEDIDOS</span>
                </a>
                <a href="categorias.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-tags fs-5 me-3"></i> 
                    <span class="sidebar-text">CATEGORÍAS</span>
                </a>
                <a href="productos.html" class="list-group-item list-group-item-action py-3 fw-bold border-dark d-flex align-items-center">
                    <i class="fa-solid fa-boxes-stacked fs-5 me-3"></i> 
                    <span class="sidebar-text">PRODUCTOS</span>
                </a>
                <a href="usuarios.html" class="list-group-item list-group-item-action py-3 fw-bold active bg-black border-dark d-flex align-items-center">
                    <i class="fa-solid fa-users fs-5 me-3"></i> 
                    <span class="sidebar-text">USUARIOS</span>
                </a>
            </div>
        </aside>

        <main class="main-content p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">GESTIÓN DE CLIENTES</h2>
                <button class="btn btn-dark rounded-0 fw-bold" onclick="cargarUsuarios()"><i class="fa-solid fa-rotate-right me-2"></i> ACTUALIZAR</button>
            </div>

            <div class="card border-dark rounded-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID ID_PERSONA</th>
                                    <th>DNI</th>
                                    <th>NOMBRES Y APELLIDOS</th>
                                    <th>EMAIL</th>
                                    <th>TELÉFONO</th>
                                    <th>COMPRAS REALIZADAS</th>
                                    <th>TOTAL CONSUMIDO</th>
                                    <th>ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-usuarios-body">
                                <tr>
                                    <td colspan="8" class="py-4 text-muted">Cargando lista de clientes...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="modalHistorialUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-0 border-dark border-2">
                <div class="modal-header bg-black text-white rounded-0">
                    <h5 class="modal-title fw-bold">HISTORIAL DE PEDIDOS: <span id="mod-cliente-nombre"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="table-responsive">
                        <table class="table table-bordered text-center small">
                            <thead class="table-light border-dark">
                                <tr>
                                    <th>ID PEDIDO</th>
                                    <th>FECHA</th>
                                    <th>ENTREGA</th>
                                    <th>TOTAL</th>
                                    <th>ESTADO</th>
                                </tr>
                            </thead>
                            <tbody id="mod-tabla-historial-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let usuariosGlobales = [];

        document.addEventListener('DOMContentLoaded', () => {
            const adminName = localStorage.getItem('usuario_nombre');
            const userRol = localStorage.getItem('usuario_rol');

            if (!adminName || userRol !== 'ADMIN') {
                window.location.href = '../auth/login.html';
                return;
            }
            
            document.getElementById('admin-name').textContent = adminName.toUpperCase();

            document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('collapsed');
            });

            document.getElementById('btn-logout').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = '../index.html';
            });

            cargarUsuarios();
        });

        async function cargarUsuarios() {
            try {
                const response = await fetch('../UsuarioServlet?action=listar_usuarios_panel');
                usuariosGlobales = await response.json();
                renderizarTabla();
            } catch (error) {
                console.error(error);
                document.getElementById('tabla-usuarios-body').innerHTML = `<tr><td colspan="8" class="text-danger py-4">Error al conectar con el servidor</td></tr>`;
            }
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tabla-usuarios-body');
            tbody.innerHTML = '';

            if (usuariosGlobales.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-muted py-4">No hay clientes registrados en el sistema.</td></tr>`;
                return;
            }

            usuariosGlobales.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold">#${u.id_persona}</td>
                    <td>${u.dni}</td>
                    <td class="text-start">${u.nombre} ${u.apellido}</td>
                    <td class="text-start small">${u.email}</td>
                    <td>${u.telefono || 'N/A'}</td>
                    <td class="fw-bold">${u.cantidad_pedidos}</td>
                    <td class="fw-bold text-success">S/ ${u.total_consumido.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-sm btn-dark rounded-0 fw-bold" onclick="verHistorialCliente(${u.id_persona})">VER HISTORIAL</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function verHistorialCliente(idPersona) {
            const u = usuariosGlobales.find(x => x.id_persona === idPersona);
            if (!u) return;

            document.getElementById('mod-cliente-nombre').textContent = `${u.nombre.toUpperCase()} ${u.apellido.toUpperCase()}`;
            const tbodyHistorial = document.getElementById('mod-tabla-historial-body');
            tbodyHistorial.innerHTML = `<tr><td colspan="5" class="py-3 text-muted">Buscando historial...</td></tr>`;

            const modal = new bootstrap.Modal(document.getElementById('modalHistorialUsuario'));
            modal.show();

            try {
                const response = await fetch(`../UsuarioServlet?action=historial_cliente&id_persona=${idPersona}`);
                const historial = await response.json();
                tbodyHistorial.innerHTML = '';

                if (historial.length === 0) {
                    tbodyHistorial.innerHTML = `<tr><td colspan="5" class="py-3 text-muted">Este cliente no registra compras aún.</td></tr>`;
                    return;
                }

                historial.forEach(p => {
                    tbodyHistorial.innerHTML += `
                        <tr>
                            <td class="fw-bold">#${p.id_pedido}</td>
                            <td class="small">${p.fecha.substring(0, 16)}</td>
                            <td><span class="small">${p.tipo_entrega}</span></td>
                            <td class="fw-bold text-success">S/ ${p.total.toFixed(2)}</td>
                            <td><span class="badge bg-dark">${p.estado}</span></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
                tbodyHistorial.innerHTML = `<tr><td colspan="5" class="text-danger py-3">Error de comunicación.</td></tr>`;
            }
        }
    </script>
</body>
</html>
