<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | La Lechería</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="bg-light py-5">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <img src="../assets/img/logotipo.png" alt="Logo" width="70" class="mb-3">
                            <h2 class="fw-bold">ÚNETE A LA LECHERÍA</h2>
                            <p class="text-muted">Regístrate para realizar tus pedidos y recibir beneficios</p>
                        </div>
                        <form id="form-registro">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Ingresa tus nombres" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Apellido</label>
                                    <input type="text" class="form-control" id="apellido" placeholder="Ingresa tus apellidos" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">DNI</label>
                                    <input type="text" class="form-control" id="dni" maxlength="8" placeholder="8 dígitos" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Teléfono</label>
                                    <input type="text" class="form-control" id="telefono" placeholder="Ej: 987654321" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label fw-bold">Dirección de Entrega</label>
                                    <input type="text" class="form-control" id="direccion" placeholder="Calle, número, urbanización y ciudad (Tacna)" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label fw-bold">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label fw-bold">Crea una Contraseña</label>
                                    <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" required>
                                </div>
                                <div class="col-md-12 mt-5">
                                    <button type="submit" class="btn btn-cow w-100 py-3 fs-5">CREAR CUENTA</button>
                                </div>
                            </div>
                            <div class="text-center mt-5">
                                <span class="text-muted">¿Ya eres parte de la familia?</span><br>
                                <a href="login.html" class="text-black fw-bold text-decoration-none fs-5">Inicia sesión aquí</a>
                            </div>
                            <div class="text-center mt-4">
                                <a href="../index.html" class="text-muted text-decoration-none small"><i class="fa-solid fa-house"></i> Volver al inicio</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
