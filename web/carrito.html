<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Pedido | La Lechería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <style>
        .stepper-wrapper { display: flex; justify-content: space-between; position: relative; margin-bottom: 2.5rem; }
        .stepper-wrapper::before { content: ""; position: absolute; top: 25px; left: 0; width: 100%; height: 3px; bg-color: #ddd; background: #ddd; z-index: 1; }
        .stepper-item { position: relative; display: flex; flex-direction: column; align-items: center; z-index: 2; flex: 1; }
        .step-counter { position: relative; width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; background: #fff; border: 3px solid #000; font-weight: bold; font-size: 1.1rem; border-radius: 50%; transition: all 0.3s ease; }
        .step-counter i { position: absolute; font-size: 2.2rem; opacity: 0.12; color: #000; z-index: 1; }
        .step-counter span { z-index: 2; position: relative; }
        .step-name { margin-top: 0.5rem; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; }
        .stepper-item.active .step-counter { background: #000; color: #fff; border-color: #000; }
        .stepper-item.active .step-counter i { color: #fff; opacity: 0.2; }
        .stepper-item.active .step-name { color: #000; }
        .stepper-item.completed .step-counter { background: #198754; color: #fff; border-color: #198754; }
        .stepper-item.completed .step-counter i { color: #fff; opacity: 0.2; }
        .stepper-item.completed .step-name { color: #198754; }
    </style>
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 1000px;">
        
        <div class="stepper-wrapper mb-5">
            <div class="stepper-item active">
                <div class="step-counter"><i class="fa-solid fa-cow"></i><span>1</span></div>
                <div class="step-name">Carrito</div>
            </div>
            <div class="stepper-item">
                <div class="step-counter"><i class="fa-solid fa-cow"></i><span>2</span></div>
                <div class="step-name">Entrega</div>
            </div>
            <div class="stepper-item">
                <div class="step-counter"><i class="fa-solid fa-cow"></i><span>3</span></div>
                <div class="step-name">Pago</div>
            </div>
        </div>

        <div class="row g-5">
            <div class="col-lg-8">
                <div class="card shadow rounded-0 border-dark border-2 mb-4">
                    <div class="card-header bg-black text-white py-3">
                        <h4 class="mb-0 fw-bold"><i class="fa-solid fa-basket-shopping me-2"></i> REVISAR MI PEDIDO</h4>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table align-middle table-hover mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th class="ps-4">Producto</th>
                                        <th>Precio</th>
                                        <th>Cantidad</th>
                                        <th>Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody id="checkout-tabla"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <a href="catalogo.html" class="btn btn-outline-dark rounded-0 fw-bold py-2 px-4"><i class="fa-solid fa-arrow-left me-2"></i> VOLVER AL CATÁLOGO</a>
            </div>

            <div class="col-lg-4">
                <div class="card shadow rounded-0 border-dark border-2 mb-4">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-ticket text-danger me-2"></i> ¿TIENES UN CUPÓN?</h5>
                        <div class="input-group">
                            <input type="text" id="input-cupón" class="form-control rounded-0 border-dark" placeholder="Ej: LECHE10">
                            <button class="btn btn-dark rounded-0 fw-bold" onclick="aplicarDescuento()">APLICAR</button>
                        </div>
                        <div id="mensaje-cupon" class="small mt-2"></div>
                    </div>
                </div>

                <div class="card shadow rounded-0 border-dark border-2">
                    <div class="card-header bg-black text-white">
                        <h5 class="mb-0 fw-bold">TOTALES</h5>
                    </div>
                    <div class="card-body fs-5">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal:</span>
                            <span id="resumen-subtotal">S/ 0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2 text-danger">
                            <span>Descuento (<span id="txt-porcentaje">0</span>%):</span>
                            <span id="resumen-descuento">- S/ 0.00</span>
                        </div>
                        <hr class="border-dark">
                        <div class="d-flex justify-content-between mb-4 fw-bold fs-4 text-success">
                            <span>TOTAL:</span>
                            <span id="resumen-total">S/ 0.00</span>
                        </div>
                        <button class="btn btn-success w-100 py-3 rounded-0 fw-bold fs-5 shadow" onclick="continuarAPedido()">
                            CONTINUAR <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/main.js"></script>
    <script>
        let porcentajeDescuento = 0;

        document.addEventListener('DOMContentLoaded', () => {
            pintarResumenCheckout();
        });

        function pintarResumenCheckout() {
            const tabla = document.getElementById('checkout-tabla');
            if(!tabla) return;
            tabla.innerHTML = '';
            let subtotalGeneral = 0;

            if (carrito.length === 0) {
                tabla.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted">Tu carrito está vacío.</td></tr>';
                actualizarPantallaTotales(0);
                return;
            }

            carrito.forEach(item => {
                const subtotalItem = item.precio * item.cantidad;
                subtotalGeneral += subtotalItem;
                tabla.innerHTML += `
                    <tr>
                        <td class="ps-4">
                            <div class="d-flex align-items-center">
                                <img src="assets/img/productos/${item.imagen}" width="50" height="50" class="me-3 border object-fit-cover">
                                <span class="fw-bold text-uppercase small">${item.nombre}</span>
                            </div>
                        </td>
                        <td>S/ ${item.precio.toFixed(2)}</td>
                        <td class="fw-bold">${item.cantidad}</td>
                        <td class="fw-bold">S/ ${subtotalItem.toFixed(2)}</td>
                    </tr>
                `;
            });
            actualizarPantallaTotales(subtotalGeneral);
        }

        function actualizarPantallaTotales(subtotal) {
            let rebaja = subtotal * (porcentajeDescuento / 100);
            let totalFinal = subtotal - rebaja;
            document.getElementById('resumen-subtotal').textContent = `S/ ${subtotal.toFixed(2)}`;
            document.getElementById('resumen-descuento').textContent = `- S/ ${rebaja.toFixed(2)}`;
            document.getElementById('resumen-total').textContent = `S/ ${totalFinal.toFixed(2)}`;
            document.getElementById('txt-porcentaje').textContent = porcentajeDescuento;
            
            localStorage.setItem('descuento_aplicado', rebaja);
            localStorage.setItem('total_final', totalFinal);
        }

        async function aplicarDescuento() {
            const codigo = document.getElementById('input-cupón').value.trim();
            const msg = document.getElementById('mensaje-cupon');
            if(!codigo) return;

            try {
                const res = await fetch(`CarritoServlet?accion=validarCupon&codigo=${codigo}`);
                const data = await res.json();

                if(data.valido) {
                    porcentajeDescuento = data.descuento;
                    msg.className = "small mt-2 text-success fw-bold";
                    msg.textContent = `¡Cupón aceptado! Obtienes ${data.descuento}% de descuento.`;
                    pintarResumenCheckout();
                } else {
                    porcentajeDescuento = 0;
                    msg.className = "small mt-2 text-danger fw-bold";
                    msg.textContent = "El cupón no existe o está agotado.";
                    pintarResumenCheckout();
                }
            } catch (error) {
                console.error(error);
            }
        }

        function continuarAPedido() {
            if(carrito.length === 0) return;

            const activeUser = localStorage.getItem('usuario_nombre');
            const idUsuario = localStorage.getItem('usuario_id');

            if (!activeUser || !idUsuario) {
                Swal.fire({
                    title: '¡Identifícate!',
                    text: "Para configurar la entrega y finalizar tu pedido debes iniciar sesión.",
                    icon: 'info',
                    confirmButtonColor: '#000',
                    confirmButtonText: 'IR AL LOGIN'
                }).then(() => {
                    window.location.href = 'auth/login.html';
                });
                return;
            }

            window.location.href = 'pedido.html';
        }
    </script>
</body>
</html>
