<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | La Lechería</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/tienda.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="assets/img/logotipo.png" alt="Logo" width="55" class="me-2">
                <span class="fw-bold fs-2 tracking-tighter">LA LECHERÍA</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link fw-bold text-black px-3" href="index.html">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-black px-3 active" href="catalogo.html">CATÁLOGO</a></li>
                </ul>
                <div class="d-flex align-items-center" id="session-wrapper">
                    <div id="guest-menu">
                        <a href="auth/login.html" class="btn btn-cow-outline"><i class="fa-solid fa-user-lock"></i> INGRESAR</a>
                    </div>
                    <div id="user-menu" class="d-none dropdown">
                        <button class="btn btn-cow dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="fa-solid fa-cow me-2"></i> <span id="display-user-name">CLIENTE</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end rounded-0 border-2 border-dark shadow">
                            <li><a class="dropdown-item py-2" href="cliente/perfil.html">MI PERFIL</a></li>
                            <li><a class="dropdown-item py-2" href="cliente/compras.html">MIS COMPRAS</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item py-2 text-danger fw-bold" href="#" id="logout-trigger">CERRAR SESIÓN</a></li>
                        </ul>
                    </div>
                    <button class="btn btn-cow ms-3 position-relative" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCart">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-white" id="cart-badge">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <header class="bg-black text-white py-5 mb-5 text-center">
        <div class="container">
            <h1 class="display-4 fw-bold text-uppercase">Nuestro Catálogo</h1>
            <p class="lead text-secondary">Del campo a tu mesa, frescura garantizada.</p>
        </div>
    </header>

    <main class="container mb-5 min-vh-100">
        <div class="row g-4" id="contenedor-productos">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-dark" role="status"></div>
                <h4 class="mt-3 fw-bold">Cargando productos de la granja...</h4>
            </div>
        </div>
    </main>

    <div class="offcanvas offcanvas-end border-start border-dark border-3" tabindex="-1" id="offcanvasCart">
        <div class="offcanvas-header bg-black text-white rounded-0">
            <h5 class="offcanvas-title fw-bold"><i class="fa-solid fa-cart-shopping me-2"></i> TU CARRITO</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0 d-flex flex-column">
            <div class="flex-grow-1 overflow-auto p-3" id="cart-items-container"></div>
            <div class="p-4 bg-light border-top border-dark">
                <div class="d-flex justify-content-between mb-3">
                    <h5 class="fw-bold mb-0">TOTAL:</h5>
                    <h5 class="fw-bold mb-0 text-success" id="cart-total">S/ 0.00</h5>
                </div>
                <button class="btn btn-cow w-100 py-3 fs-5" id="btn-procesar-pago" onclick="irAlCarrito()">VER DETALLE DE COMPRA</button>
            </div>
        </div>
    </div>

    <footer class="footer-main">
        <div class="container">
            <div class="row mt-5 pt-4 border-top border-secondary opacity-50">
                <div class="col-md-6 text-center text-md-start">
                    <p class="small mb-0">&copy; 2026 LA LECHERÍA TACNA. TODOS LOS DERECHOS RESERVADOS.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('ProductoServlet?accion=listarJSON');
                const productos = await res.json();
                const contenedor = document.getElementById('contenedor-productos');
                contenedor.innerHTML = '';

                if(productos.length === 0) {
                    contenedor.innerHTML = '<div class="col-12 text-center text-muted py-5"><h4>No hay productos disponibles por el momento.</h4></div>';
                    return;
                }

                productos.forEach(p => {
                    contenedor.innerHTML += `
                        <div class="col-md-4 col-lg-3">
                            <div class="card card-product h-100 bg-white">
<img src="/Ecommerce-Cocodrilo/assets/img/productos/${p.imagen}" class="card-img-top img-producto" alt="${p.nombre}">                                <div class="card-body d-flex flex-column">
                                    <span class="badge bg-dark text-white rounded-0 w-50 mb-2">${p.categoria}</span>
                                    <h5 class="card-title fw-bold text-uppercase">${p.nombre}</h5>
                                    <p class="card-text text-muted small flex-grow-1">${p.descripcion}</p>
                                    <h3 class="precio-tag mb-3">S/ ${p.precio.toFixed(2)}</h3>
                                    <button class="btn btn-cow-outline w-100 mt-auto" onclick="agregarAlCarrito('${p.id_producto}', '${p.nombre}', ${p.precio}, '${p.imagen}')">
                                        <i class="fa-solid fa-cart-plus me-2"></i> AÑADIR
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error cargando catálogo', error);
                document.getElementById('contenedor-productos').innerHTML = '<div class="col-12 text-center text-danger py-5"><h4>Error al conectar con la granja. Intente nuevamente.</h4></div>';
            }
        });
    </script>
</body>
</html>
